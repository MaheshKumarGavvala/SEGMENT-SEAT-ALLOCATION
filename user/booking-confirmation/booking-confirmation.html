<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Segment — Booking History</title>
<link rel="stylesheet" href="../../auth/shared/css/ui-polish.css">
<link rel="stylesheet" href="../user.css">
<link rel="stylesheet" href="booking-confirmation.css?v=10">
<script>
(function(){
  if(window.top!==window.self){
    document.documentElement.classList.add("embedded");
    try{document.documentElement.dataset.theme=localStorage.getItem("smartSegmentTheme")||"light"}catch(e){}
    window.addEventListener("message",e=>{
      if(e.data&&e.data.type==="theme")document.documentElement.dataset.theme=e.data.theme;
    });
  }
})();
</script>
</head>
<body>
<header class="app-header">
  <a class="brand" href="../dashboard/index.html">
    <span class="brand-mark"><i class="fa-solid fa-bus"></i></span>
    <span>Smart Segment</span>
  </a>
  <div class="header-actions">
    <button class="icon-button" data-theme-toggle title="Change theme" aria-label="Change theme"><i data-theme-icon></i></button>
    <button class="profile-button" type="button"><span class="avatar">M</span><span>Mahesh</span><i class="fa-solid fa-chevron-down"></i></button>
  </div>
</header>

<div class="app-layout">
  <aside class="sidebar">
    <div class="nav-label">Main</div>
    <a class="nav-item" href="../dashboard/index.html"><i class="fa-solid fa-grid-2"></i><span>Dashboard</span></a>
    <a class="nav-item active" href="booking-confirmation.html"><i class="fa-solid fa-ticket"></i><span>My Bookings</span></a>
    <a class="nav-item" href="#"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    <a class="nav-item" href="#"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
    <div class="nav-label">Account</div>
    <a class="nav-item" href="../../auth/auth/login/login.html" id="logoutLink"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
  </aside>

  <main class="main">
    <div class="container history-page">

      <div class="history-header">
        <div>
          <span class="history-kicker"><i class="fa-solid fa-ticket"></i> MY BOOKINGS</span>
          <h1>Booking History</h1>
          <p>View your confirmed and cancelled journeys in one place.</p>
        </div>
        <button class="btn history-home" id="goHomeTop" type="button"><i class="fa-solid fa-house"></i> Dashboard</button>
      </div>

      <section class="history-summary">
        <div class="summary-box">
          <span class="summary-icon"><i class="fa-solid fa-ticket"></i></span>
          <div><small>TOTAL BOOKINGS</small><b id="totalCount">0</b></div>
        </div>
        <div class="summary-box">
          <span class="summary-icon confirmed"><i class="fa-solid fa-circle-check"></i></span>
          <div><small>CONFIRMED</small><b id="confirmedCount">0</b></div>
        </div>
        <div class="summary-box">
          <span class="summary-icon cancelled"><i class="fa-solid fa-ban"></i></span>
          <div><small>CANCELLED</small><b id="cancelledCount">0</b></div>
        </div>
      </section>

      <section class="history-card">
        <div class="history-toolbar">
          <div>
            <h2>Your tickets</h2>
            <p>Click any ticket to view the complete journey.</p>
          </div>
          <div class="history-filters" role="tablist" aria-label="Booking filters">
            <button class="history-filter active" data-filter="all" type="button">All</button>
            <button class="history-filter" data-filter="confirmed" type="button">Confirmed</button>
            <button class="history-filter" data-filter="cancelled" type="button">Cancelled</button>
          </div>
        </div>
        <div id="bookingList" class="booking-list"></div>
      </section>

      <div class="history-footer-actions">
        <button class="btn primary" id="goHome" type="button"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" role="status" aria-live="polite"></div>

<script src="../../auth/shared/js/api.js"></script>
<script src="../../auth/shared/js/theme.js"></script>
<script src="../../auth/shared/js/ui.js"></script>
<script src="../../auth/shared/js/modal.js"></script>
<script src="../../auth/shared/js/validation.js"></script>
<script src="booking-confirmation.js?v=10"></script>
</body>
</html>
