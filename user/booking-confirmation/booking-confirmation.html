<script>if(new URLSearchParams(location.search).get("embedded")==="1")document.documentElement.classList.add("embedded");</script><link rel="stylesheet" href="booking-confirmation.css"><script>(function(){
 if(window.top!==window.self){
   document.documentElement.classList.add("embedded");
   function applyTheme(t){if(t)document.documentElement.dataset.theme=t}
   try{applyTheme(localStorage.getItem("smartSegmentTheme")||"light")}catch(e){}
   window.addEventListener("message",function(e){if(e.data&&e.data.type==="theme")applyTheme(e.data.theme)});
   window.addEventListener("DOMContentLoaded",function(){
     // Intercept only navigation links. Buttons keep their existing behavior.
     document.querySelectorAll('a[href]').forEach(function(a){
       if(a.dataset.smartFrameBound)return;a.dataset.smartFrameBound="1";
       a.addEventListener("click",function(ev){
         const href=a.getAttribute("href");if(!href||href==="#"||/^https?:|^mailto:/i.test(href))return;
         ev.preventDefault();
         const u=new URL(href,location.href);u.searchParams.set("embedded","1");
         parent.postMessage({type:"navigateFrame",url:u.href,title:(document.title||"").replace("Smart Segment — ","").replace(" | Smart Segment","")},"*");
       });
     });
   });
 }
})();</script><style>

html.embedded .app-layout{display:block!important;min-height:0!important}

html.embedded [data-theme-toggle],
html.embedded #theme,
html.embedded #themeToggle,
html.embedded .theme-toggle,
html.embedded .header-theme{display:none!important}
</style><style>
