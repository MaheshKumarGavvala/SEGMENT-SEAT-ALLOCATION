<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f36f21"><title>Smart Segment | Password recovery</title>
<link rel="stylesheet" href="forgot-password.css?v=13">
</head>
<body>
<main class="auth-page">
  <section class="auth-card" aria-label="Smart Segment password recovery">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="13" rx="2"/><path d="M7 9h10M8 18v2m8-2v2M7 14h.01M17 14h.01"/></svg></div>
      <div><strong>Smart Segment</strong><span>Intelligent bus reservations</span></div>
    </div>
    <div class="title"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset your password</h1><p>Enter your registered email and choose a new password to regain access.</p></div>
    <form id="resetForm" novalidate>
      <label class="field"><span>Email <b>*</b></span><div class="control"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="emailError"><small id="emailError"></small></div></label>
      <label class="field"><span>New password <b>*</b></span><div class="control"><input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Create a new password" aria-describedby="passwordError"><button class="eye" id="passwordToggle" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.3-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.3 5.5-9.5 5.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button><small id="passwordError"></small></div></label>
      <p class="message" id="error" role="alert"></p>
      <div class="success" id="success" hidden><span>Password updated successfully. You can sign in now.</span></div>
      <button class="submit" id="resetBtn" type="submit"><span>Update password</span><svg viewBox="0 0 24 24"><path d="M5 12h13m-6-6 6 6-6 6"/></svg></button>
      <p class="bottom-link">Remembered it? <a href="../login/login.html">Back to sign in</a></p>
    </form>
    <div class="auth-footer"><span>SMART SEGMENT</span><i></i><span>Secure reservation platform</span></div>
  </section>
</main>
<script src="../../shared/js/api.js"></script><script src="forgot-password.js?v=13"></script>
</body></html>
