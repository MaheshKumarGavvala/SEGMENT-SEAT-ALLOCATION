<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f36f21"><title>Smart Segment | Sign in</title>
<link rel="stylesheet" href="login.css?v=11">
</head>
<body>
<main class="login-page">
  <section class="login-card" aria-label="Smart Segment sign in">
    <div class="login-brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="13" rx="2"/><path d="M7 9h10M8 18v2m8-2v2M7 14h.01M17 14h.01"/></svg></div>
      <div><strong>Smart Segment</strong><span>Intelligent bus reservations</span></div>
    </div>
    <div class="login-title"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your account</h1><p>Book smarter journeys and manage your tickets in one place.</p></div>
    <form id="loginForm" novalidate>
      <label class="field"><span>Email <b>*</b></span><div class="control"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="emailError"><small id="emailError"></small></div></label>
      <label class="field"><span>Password <b>*</b></span><div class="control"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="passwordError"><button class="eye" id="passwordToggle" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.3-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.3 5.5-9.5 5.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button><small id="passwordError"></small></div></label>
      <div class="field"><span>Continue as</span><div class="role-switch" id="roleSwitch"><button type="button" class="active" data-role="user">Passenger</button><button type="button" data-role="admin">Administrator</button></div></div>
      <input type="hidden" id="role" value="user">
      <div class="options"><label class="remember"><input type="checkbox" id="remember"> Remember me</label><a href="../forgot-password/forgot-password.html">Forgot password?</a></div>
      <button class="submit" id="submitBtn" type="submit"><span class="btn-text">Sign in</span><svg viewBox="0 0 24 24"><path d="M5 12h13m-6-6 6 6-6 6"/></svg></button>
      <div class="or-divider"><span>OR</span></div>
      <button class="google-btn" id="googleBtn" type="button"><span class="google-g">G</span><span>Continue with Google</span></button>
      <p class="message" id="message" role="alert"></p>
      <p class="bottom-link">New passenger? <a href="../register/register.html">Create your account</a></p>
    </form>
    <div class="login-footer"><span>SMART SEGMENT</span><i></i><span>Secure reservation platform</span></div>
  </section>
</main>
<script src="../../shared/js/api.js"></script><script src="login.js?v=11"></script>
</body></html>
