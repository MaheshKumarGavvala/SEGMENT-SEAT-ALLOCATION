<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f36f21"><title>Smart Segment | Create account</title>
<link rel="stylesheet" href="register.css?v=14">
</head>
<body>
<main class="login-page">
  <section class="login-card" aria-label="Smart Segment create account">
    <div class="login-brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="13" rx="2"/><path d="M7 9h10M8 18v2m8-2v2M7 14h.01M17 14h.01"/></svg></div>
      <div><strong>Smart Segment</strong><span>Intelligent bus reservations</span></div>
    </div>
    <div class="login-title"><span class="eyebrow">PASSENGER ACCOUNT</span><h1>Create your account</h1><p>Set up your Smart Segment passenger profile in less than a minute.</p></div>
    <form id="registerForm" novalidate>
      <label class="field"><span>Full name <b>*</b></span><div class="control"><input id="name" maxlength="20" autocomplete="name" required placeholder="Enter your full name" aria-describedby="nameError"><small id="nameError"></small></div></label>
      <label class="field"><span>Email <b>*</b></span><div class="control"><input id="email" type="email" autocomplete="email" required placeholder="you@gmail.com" aria-describedby="emailError"><small id="emailError"></small></div></label>
      <label class="field"><span>Password <b>*</b></span><div class="control"><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Create a strong password" aria-describedby="passwordError"><button class="eye" id="passwordToggle" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.3-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.3 5.5-9.5 5.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button><small id="passwordError"></small></div><div class="password-meter" id="meter" data-level="0"><i></i><i></i><i></i><i></i></div><span class="strength" id="strength">Use at least 6 characters.</span></label>
      <div class="helper-row"><svg viewBox="0 0 24 24"><path d="M12 3 20 7v5c0 4.6-3 7.8-8 9-5-1.2-8-4.4-8-9V7l8-4Z"/><path d="m8.5 12 2.2 2.2 4.8-4.8"/></svg><span>Use 8+ characters with uppercase, lowercase and a number.</span></div>
      <p class="message" id="message" role="alert"></p>
      <button class="submit" id="submit" type="submit"><span>Create passenger account</span><svg viewBox="0 0 24 24"><path d="M5 12h13m-6-6 6 6-6 6"/></svg></button>
      <p class="bottom-link">Already have an account? <a href="../login/login.html">Sign in</a></p>
    </form>
    <div class="login-footer"><span>SMART SEGMENT</span><i></i><span>Secure reservation platform</span></div>
  </section>
</main>
<script src="../../shared/js/api.js"></script><script src="register.js?v=14"></script>
</body></html>
